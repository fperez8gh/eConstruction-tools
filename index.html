<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State DOT Inspector Dashboard</title>
    <link rel="stylesheet" href="styles/styles.css"> <!-- Optional shared styles -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-text-size-adjust: 100%;
        }
        .dropdown {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .dropdown-btn {
            background-color: #2c3e50;
            color: white;
            padding: 12px 14px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            line-height: 1.2;
            border-radius: 0 0 5px 0;
            display: block;
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .dropdown-btn:hover {
            background-color: #34495e;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #2c3e50;
            min-width: 240px;
            max-width: min(92vw, 360px);
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.22);
            border-radius: 0 0 5px 5px;
            max-height: calc(100dvh - 54px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .dropdown-content.open {
            display: block;
        }
        .dropdown-content a {
            color: white;
            padding: 12px 14px;
            text-decoration: none;
            display: block;
            font-size: 16px;
            line-height: 1.25;
            min-height: 44px;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .dropdown-content a:hover {
            background-color: #34495e;
        }
        /* Do not use :hover to open the menu: iPad Safari can leave it stuck open. */
        @media (hover: hover) and (pointer: fine) {
            .dropdown-btn:hover {
                background-color: #34495e;
            }
            .dropdown-content a:hover {
                background-color: #34495e;
            }
        }
        @media (max-width: 600px) {
            .dropdown-content {
                min-width: min(280px, 92vw);
            }
        }
        .main-content {
            background-color: #ecf0f1;
            height: 100vh;
            height: 100dvh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="dropdown">
        <button class="dropdown-btn" id="dropdown-toggle"
                type="button" aria-expanded="false" aria-controls="dropdown-menu">
            ▼
        </button>
        <div class="dropdown-content" id="dropdown-menu">
            <a href="#" onclick="loadModule(event, 'modules/unit-conversion.html')">Unit Conversions</a>
            <a href="#" onclick="loadModule(event, 'modules/density-mass-volume-calculator.html')">Density, Mass, Volume Calculator</a>
            <a href="#" onclick="loadModule(event, 'modules/grade-slope-taper.html')">Grade, Slope or Taper</a>
            <a href="#" onclick="loadModule(event, 'modules/excavation.html')">Excavation Calculator</a>
            <a href="#" onclick="loadModule(event, 'modules/asphalt-pavement-calculator.html')">Asphalt Pavement Calculator</a>
            <a href="#" onclick="loadModule(event, 'modules/concrete-yield-calculator.html')">Concrete Yield Calculator</a>
            <a href="#" onclick="loadModule(event, 'modules/sand-cone-test.html')">Sand Cone Test</a>
            <a href="#" onclick="loadModule(event, 'modules/sieve-analysis.html')">Sieve Analysis (JMF)</a>
            <a href="#" onclick="loadModule(event, 'modules/DMS to Decimal Degrees Converter.html')">GPS Coordinates Converter</a>
            <a href="#" onclick="loadModule(event, 'modules/rebar.html')">Rebar Selector</a>
            <a href="#" onclick="loadModule(event, 'modules/force_account.html')">Force Account</a>
            <a href="#" onclick="loadModule(event, 'modules/module11.html')">Module 10</a>
            <a href="#" onclick="loadModule(event, 'modules/FSTQP.html')">Certification Practice Questions</a>
            <a href="#" onclick="loadModule(event, 'modules/updates.html')">Updates & Support</a>
        </div>
    </div>
    <div class="main-content">
        <iframe id="module-frame" src="modules/unit-conversion.html"></iframe>
    </div>

    <script>
        const dropdownToggle = document.getElementById('dropdown-toggle');
        const dropdownMenu = document.getElementById('dropdown-menu');

        function setMenuOpen(open) {
            dropdownMenu.classList.toggle('open', open);
            dropdownToggle.setAttribute('aria-expanded', String(open));
        }

        dropdownToggle.addEventListener('click', function () {
            setMenuOpen(!dropdownMenu.classList.contains('open'));
        });

        function loadModule(event, moduleUrl) {
            event.preventDefault();
            document.getElementById('module-frame').src = moduleUrl;
            setMenuOpen(false);
        }

        // Close the menu when the user taps outside it.
        document.addEventListener('click', function (event) {
            if (!event.target.closest('.dropdown')) {
                setMenuOpen(false);
            }
        });

        // Escape key support for keyboard users.
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                setMenuOpen(false);
                dropdownToggle.focus();
            }
        });
    </script>
</body>
</html>
